[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-ledger"
version = "0.1.0"
description = "Read-only battery dispatch state-of-charge consistency checks"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
soc-ledger = "soc_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
